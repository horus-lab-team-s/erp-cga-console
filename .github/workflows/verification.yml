# Ce qui doit être vrai avant qu'un changement n'entre dans `main` : la console du cabinet et l'espace de l'adhérent.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ CE QUE CETTE CHAÎNE NE PEUT PAS VÉRIFIER SEULE
#
# L'invariant du projet — *tout ce que le serveur permet est à l'écran* — porte
# sur ce dépôt ET sur celui du serveur. Il se mesure donc **là-bas**, par trois
# outils qui récupèrent cette interface et lisent ses appels. Un écran ajouté ici
# sans route derrière, ou une route retirée là-bas dont un écran dépend encore,
# ne se voit pas dans cette chaîne : elle se voit dans celle de `erp-cga-backend`.
#
# C'est le prix de la scission, et il est assumé : mieux vaut un contrôle qui vit
# à un seul endroit et qu'on sait aller lire, que deux moitiés de contrôle qui se
# croient complètes chacune de son côté.
#
# POURQUOI `tsc` AVANT `build`
#
# Il rend une erreur qui nomme le fichier et la ligne, là où l'échec de
# compilation d'un composant serveur mène souvent à une trace illisible.
# ─────────────────────────────────────────────────────────────────────────────

name: Vérification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Console — types, lint et compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` et non `npm install` : la chaîne échoue si le verrou ne
      # correspond pas au manifeste, au lieu de le mettre à jour en silence.
      - name: Installer
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Compilation
        run: npm run build

  image:
    name: Image — construction du conteneur
    runs-on: ubuntu-latest
    needs: [interface]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # ⚠️ Construite, jamais poussée. Ce qui est vérifié ici, c'est que le
      # `Dockerfile` tient. Le contexte est le dépôt lui-même depuis la scission :
      # c'était la racine du monodépôt, avec `-f Frontend_erp_cga/Dockerfile`.
      - name: Console
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
